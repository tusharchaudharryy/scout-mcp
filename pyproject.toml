[project]
name = "scout-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents private web search (SearXNG), safe page fetching and BM25 search over your own notes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tushar Chaudhary", email = "chaudharytushar477@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5",
    "httpx2>=2.16",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.11",
]

[project.urls]
Repository = "https://github.com/tusharchaudharryy/scout-mcp"
Issues = "https://github.com/tusharchaudharryy/scout-mcp/issues"

[project.scripts]
scout-mcp = "scout_mcp:main"
scout = "scout_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_mcp", "src/scout_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
